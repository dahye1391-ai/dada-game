<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다다 오목 · 다다 게임방</title><style>
*{box-sizing:border-box}body{margin:0;background:#101524;color:#f8f9ff;font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:28px 18px 40px}a{color:#b4c2dd;text-decoration:none}.tag{color:#b19dff;letter-spacing:3px;font-size:12px;font-weight:800;margin-top:30px}h1{font-size:clamp(32px,5vw,48px);margin:12px 0}p{color:#aebbd4;line-height:1.8}.layout{display:grid;grid-template-columns:minmax(0,650px) minmax(220px,1fr);gap:28px;align-items:start;margin-top:28px}.board-wrap{padding:18px;border-radius:20px;background:#ba8651;box-shadow:0 16px 50px #0004}.board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));aspect-ratio:1;background:#e6b878;border-radius:3px}.cell{padding:0;border:0;background:transparent;position:relative;cursor:pointer;min-width:0;aspect-ratio:1;touch-action:manipulation}.cell:before,.cell:after{content:'';position:absolute;background:#866339;pointer-events:none}.cell:before{height:1px;width:100%;left:0;top:50%}.cell:after{width:1px;height:100%;top:0;left:50%}.cell.left:before{left:50%;width:50%}.cell.right:before{width:50%}.cell.top:after{top:50%;height:50%}.cell.bottom:after{height:50%}.cell:focus-visible{outline:2px solid #6632bd;outline-offset:-2px;z-index:4}.stone{position:absolute;inset:8%;border-radius:50%;z-index:2;box-shadow:2px 3px 4px #0004;pointer-events:none}.black{background:radial-gradient(circle at 30% 25%,#545660,#17181d 65%,#090a0d)}.white{background:radial-gradient(circle at 30% 25%,#fff,#ecece8 65%,#c4c5c4);border:1px solid #bbb}.last:after{content:'';position:absolute;inset:37%;background:#ff795f;border-radius:50%}.winning{outline:3px solid #a2fa60;outline-offset:-3px}.star{position:absolute;inset:43%;border-radius:50%;background:#735032;z-index:1;pointer-events:none}.side{background:#1c2539;border:1px solid #34405a;border-radius:20px;padding:24px}.mode-label{font-size:14px;color:#aebbd4}select,.action{font:inherit;border-radius:11px;padding:12px 15px;width:100%}select{margin:9px 0 22px;background:#29344c;border:1px solid #5b6983;color:white}.turn{font-size:21px;color:#bdff81;font-weight:800;line-height:1.5;min-height:64px}.players{display:flex;gap:14px;justify-content:space-between;padding:18px 0;border-bottom:1px solid #36415a}.badge{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:middle}.badge.black{border:1px solid #647087}.badge.white{border:1px solid #ccc}.moves{font-size:13px;color:#95a6c3;padding:18px 0}.action{border:0;cursor:pointer;background:#bdff81;color:#142112;font-weight:800;margin-bottom:10px}.secondary{background:#303c55;color:#d9e3f6}.action:disabled{opacity:.4;cursor:default}.rules{font-size:13px;margin:14px 0 0}select:focus-visible,.action:focus-visible{outline:3px solid #b19dff;outline-offset:3px}@media(max-width:780px){.layout{grid-template-columns:1fr;gap:20px}.board-wrap{padding:12px}.side{padding:20px}.turn{min-height:0}.players{justify-content:flex-start;gap:28px}}@media(prefers-reduced-motion:no-preference){.stone{animation:place .15s ease-out}@keyframes place{from{transform:scale(.65)}to{transform:scale(1)}}}
</style></head><body><main><a href="./">← 게임 목록으로 돌아가기</a><div class="tag">DADA GOMOKU</div><h1>다섯 개를 이어보세요 ⚫</h1><p>한 수씩, 신중하게. 컴퓨터 또는 친구와 오목 한 판!</p><div class="layout"><section class="board-wrap" aria-label="오목판"><div id="board" class="board" role="group" aria-label="15행 15열 오목판"></div></section><aside class="side"><label class="mode-label" for="mode">대전 방식</label><select id="mode"><option value="ai">혼자 하기 · 컴퓨터 대전</option><option value="two">함께 하기 · 2인 대전</option></select><div id="status" class="turn" role="status" aria-live="polite">흑돌을 놓아주세요.</div><div class="players"><span><i class="badge black"></i><span id="black-label">나</span></span><span><i class="badge white"></i><span id="white-label">컴퓨터</span></span></div><div id="moves" class="moves">0수 진행</div><button id="undo" class="action secondary" disabled>한 수 무르기</button><button id="restart" class="action">다시 시작</button><p class="rules">흑이 먼저 시작합니다.<br>가로·세로·대각선으로 5개 이상 연결하면 승리!<br>자유오목이며 금수는 없습니다.</p><p class="rules">돌을 놓을 칸을 클릭하거나 터치하세요.<br>키보드: 방향키로 이동 · Enter로 돌 놓기</p></aside></div></main><script>
const N=15,dirs=[[1,0],[0,1],[1,1],[1,-1]],boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),modeEl=document.querySelector('#mode');let cells=[],board=[],history=[],turn=1,over=false,thinking=false,winning=[],timer=null,version=0,focusIndex=112;
const inside=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
function lineAt(r,c,color){for(const [dr,dc] of dirs){const points=[[r,c]];for(const sign of [-1,1]){let rr=r+dr*sign,cc=c+dc*sign;while(inside(rr,cc)&&board[rr][cc]===color){points.push([rr,cc]);rr+=dr*sign;cc+=dc*sign;}}if(points.length>=5)return points;}return [];}
function threat(r,c,color){let total=0;for(const [dr,dc] of dirs){let count=1,open=0;for(const sign of [-1,1]){let rr=r+dr*sign,cc=c+dc*sign;while(inside(rr,cc)&&board[rr][cc]===color){count++;rr+=dr*sign;cc+=dc*sign;}if(inside(rr,cc)&&board[rr][cc]===0)open++;}if(count>=5)total+=10000000;else if(count===4)total+=open===2?100000:open===1?18000:0;else if(count===3)total+=open===2?5500:open===1?500:0;else if(count===2)total+=open===2?300:open===1?40:0;else total+=open*5;}return total;}
function aiMove(){const candidates=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(board[r][c])continue;let near=false;for(let dr=-2;dr<=2&&!near;dr++)for(let dc=-2;dc<=2;dc++)if(inside(r+dr,c+dc)&&board[r+dr][c+dc]){near=true;break;}if(near)candidates.push([r,c]);}if(!candidates.length)return [7,7];for(const p of candidates){if(lineAt(p[0],p[1],2).length)return p;}for(const p of candidates){if(lineAt(p[0],p[1],1).length)return p;}let best=candidates[0],value=-Infinity;for(const [r,c] of candidates){const attack=threat(r,c,2),defense=threat(r,c,1),score=attack+defense*1.1-(Math.abs(7-r)+Math.abs(7-c));if(score>value){value=score;best=[r,c];}}return best;}
function updateStatus(){document.querySelector('#undo').disabled=!history.length;document.querySelector('#moves').textContent=history.length+'수 진행';document.querySelector('#black-label').textContent=modeEl.value==='ai'?'나':'흑 플레이어';document.querySelector('#white-label').textContent=modeEl.value==='ai'?'컴퓨터':'백 플레이어';if(over){statusEl.textContent=winning.length?(history.at(-1).color===1?(modeEl.value==='ai'?'승리했어요! 🎉':'흑돌 승리! 🎉'):(modeEl.value==='ai'?'컴퓨터가 이겼어요!':'백돌 승리! 🎉')):'무승부입니다!';return;}statusEl.textContent=thinking?'컴퓨터가 생각 중이에요…':turn===1?'흑돌을 놓아주세요.':'백돌을 놓아주세요.';}
function render(){const last=history.at(-1);cells.forEach((cell,i)=>{const r=Math.floor(i/N),c=i%N,color=board[r][c];cell.replaceChildren();if(color){const stone=document.createElement('span');stone.className='stone '+(color===1?'black':'white')+(last&&last.r===r&&last.c===c?' last':'')+(winning.some(p=>p[0]===r&&p[1]===c)?' winning':'');cell.append(stone);}else if([3,7,11].includes(r)&&[3,7,11].includes(c)){const star=document.createElement('span');star.className='star';cell.append(star);}cell.setAttribute('aria-label',(r+1)+'행 '+(c+1)+'열 '+(color===1?'흑돌':color===2?'백돌':'빈칸'));cell.setAttribute('aria-disabled',String(Boolean(color)||over||thinking));cell.tabIndex=i===focusIndex?0:-1;});updateStatus();}
function reset(){clearTimeout(timer);version++;board=Array.from({length:N},()=>Array(N).fill(0));history=[];turn=1;over=false;thinking=false;winning=[];focusIndex=112;render();}
function put(r,c){if(over||board[r][c]||!inside(r,c))return false;board[r][c]=turn;history.push({r,c,color:turn});winning=lineAt(r,c,turn);if(winning.length||history.length===N*N){over=true;}else turn=3-turn;render();return true;}
function humanMove(r,c){if(over||thinking||(modeEl.value==='ai'&&turn===2))return;if(!put(r,c)||over||modeEl.value!=='ai')return;thinking=true;render();const token=version;timer=setTimeout(()=>{if(token!==version)return;const [rr,cc]=aiMove();thinking=false;put(rr,cc);},280);}
function undo(){if(!history.length)return;clearTimeout(timer);version++;const count=modeEl.value==='ai'&&!thinking&&history.at(-1).color===2?2:1;for(let i=0;i<count&&history.length;i++){const move=history.pop();board[move.r][move.c]=0;}turn=history.length%2===0?1:2;over=false;thinking=false;winning=[];render();}
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=document.createElement('button');b.type='button';b.className='cell'+(c===0?' left':'')+(c===N-1?' right':'')+(r===0?' top':'')+(r===N-1?' bottom':'');b.onclick=()=>{focusIndex=r*N+c;humanMove(r,c);};b.onfocus=()=>{focusIndex=r*N+c;cells.forEach((cell,i)=>cell.tabIndex=i===focusIndex?0:-1);};b.onkeydown=e=>{const delta={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.code];if(!delta)return;e.preventDefault();const rr=Math.max(0,Math.min(N-1,r+delta[0])),cc=Math.max(0,Math.min(N-1,c+delta[1]));cells[rr*N+cc].focus();};cells.push(b);boardEl.append(b);}
document.querySelector('#undo').onclick=undo;document.querySelector('#restart').onclick=reset;modeEl.onchange=reset;reset();
</script></body></html>
