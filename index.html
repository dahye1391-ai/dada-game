<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다다 런 · 달리기 게임</title><style>
*{box-sizing:border-box}body{margin:0;background:#111626;color:#f7f8ff;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:36px 18px}.tag{color:#bdff81;font-weight:800;letter-spacing:3px}h1{font-size:clamp(36px,7vw,64px);margin:12px 0}p{color:#bac5df;line-height:1.7}.hud{display:flex;gap:16px;justify-content:space-between;background:#202940;padding:18px;border-radius:18px;margin:24px 0}.hud strong{display:block;font-size:26px;color:white}canvas{display:block;width:100%;border-radius:22px;background:#c9eaf4;touch-action:manipulation}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{font:inherit;font-weight:700;background:#bdff81;color:#152313;border:0;border-radius:14px;padding:16px 26px;cursor:pointer;touch-action:manipulation}button.secondary{background:#283650;color:white}button:focus-visible,canvas:focus-visible{outline:3px solid #ffba69;outline-offset:4px}#status{min-height:28px}footer{color:#8292b2;font-size:13px;margin-top:30px}</style></head>
<body><main><div class="tag">DADA RUN</div><h1>멈추지 말고 달려요 🏃</h1><p>장애물을 뛰어넘고, 나만의 최고 기록에 도전하세요.</p><div class="hud"><div>달린 거리<strong id="score">0 m</strong></div><div>최고 기록<strong id="best">0 m</strong></div><div>속도<strong id="speed">1.0 ×</strong></div></div><canvas id="game" width="900" height="400" tabindex="0" role="img" aria-label="장애물 달리기 게임. 스페이스 또는 위쪽 방향키로 점프하세요."></canvas><div class="controls"><button id="start">달리기 시작</button><button id="jump">점프 ↑</button><button id="pause" class="secondary">일시정지</button></div><p id="status" role="status" aria-live="polite">PC: 스페이스 / ↑ · 모바일: 화면 터치 또는 점프 버튼</p><footer>장애물에 부딪히면 종료됩니다. 최고 기록은 이 브라우저에 저장됩니다.</footer></main>
<script>
const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),speedEl=document.querySelector('#speed'),status=document.querySelector('#status'),startBtn=document.querySelector('#start'),pauseBtn=document.querySelector('#pause');
let best=0;try{best=Number(localStorage.getItem('dada-run-best'))||0;}catch(e){}bestEl.textContent=best+' m';
const floor=320;let mode='ready',player,obstacles,distance,speed,spawn,time,last=0;
function reset(){player={x:110,y:floor-48,w:32,h:48,vy:0};obstacles=[];distance=0;speed=300;spawn=1.4;time=0;scoreEl.textContent='0 m';speedEl.textContent='1.0 ×';}
function start(){reset();mode='running';startBtn.textContent='처음부터 다시';pauseBtn.textContent='일시정지';status.textContent='장애물이 오면 점프하세요!';}
function jump(){if(mode==='ready'){start();}if(mode==='running'&&player.y>=floor-player.h-.1)player.vy=-640;}
function pause(){if(mode==='running'){mode='paused';pauseBtn.textContent='계속 달리기';status.textContent='잠시 쉬는 중이에요.';}else if(mode==='paused'){mode='running';pauseBtn.textContent='일시정지';status.textContent='다시 달려요!';}}
function end(){mode='over';const record=Math.floor(distance);if(record>best){best=record;bestEl.textContent=best+' m';try{localStorage.setItem('dada-run-best',String(best));}catch(e){}}status.textContent=record+' m 달렸어요! 다시 도전해보세요.';startBtn.textContent='다시 달리기';}
function update(dt){time+=dt;speed=Math.min(540,300+time*3);distance+=speed*dt/20;player.vy+=1700*dt;player.y+=player.vy*dt;if(player.y>=floor-player.h){player.y=floor-player.h;player.vy=0;}spawn-=dt;if(spawn<=0){obstacles.push({x:920,w:26+Math.random()*12,h:32+Math.random()*18});spawn=1.15+Math.random()*.7;}for(const o of obstacles){o.x-=speed*dt;if(player.x+player.w-5>o.x+3&&player.x+5<o.x+o.w-3&&player.y+player.h-3>floor-o.h+3){end();break;}}obstacles=obstacles.filter(o=>o.x+o.w>0);scoreEl.textContent=Math.floor(distance)+' m';speedEl.textContent=(speed/300).toFixed(1)+' ×';}
function draw(){const sky=ctx.createLinearGradient(0,0,0,400);sky.addColorStop(0,'#c2e7f8');sky.addColorStop(1,'#eef5d9');ctx.fillStyle=sky;ctx.fillRect(0,0,900,400);ctx.fillStyle='#fff9d1';ctx.beginPath();ctx.arc(760,65,32,0,Math.PI*2);ctx.fill();for(let i=0;i<6;i++){const x=((i*210-distance*3)%1200+1200)%1200-150;ctx.fillStyle='#ffffffa0';ctx.beginPath();ctx.ellipse(x,75+i%2*40,55,17,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#9bc4a1';for(let i=0;i<7;i++){const x=i*180-100-(distance*2%180);ctx.beginPath();ctx.moveTo(x,320);ctx.lineTo(x+100,165+i%2*40);ctx.lineTo(x+210,320);ctx.fill();}ctx.fillStyle='#456a4a';ctx.fillRect(0,floor,900,6);ctx.fillStyle='#e4d6b8';ctx.fillRect(0,floor+6,900,74);ctx.fillStyle='#bfad8b';for(let i=0;i<24;i++)ctx.fillRect(i*45-(distance*20%45),350,15,3);
for(const o of obstacles){ctx.fillStyle='#dd7654';ctx.fillRect(o.x,floor-o.h,o.w,o.h);ctx.fillStyle='#ffc599';ctx.fillRect(o.x+4,floor-o.h+4,o.w-8,6);}
const p=player;ctx.fillStyle='#202941';ctx.fillRect(p.x+7,p.y+2,22,20);ctx.fillStyle='#ffe0b1';ctx.fillRect(p.x+10,p.y+8,20,13);ctx.fillStyle='#202941';ctx.fillRect(p.x+24,p.y+12,3,3);ctx.fillStyle='#8264e8';ctx.fillRect(p.x+3,p.y+23,26,15);ctx.fillStyle='#303654';const stride=mode==='running'&&p.vy===0?Math.sin(time*22)*6:0;ctx.fillRect(p.x+5+stride,p.y+38,9,10);ctx.fillRect(p.x+20-stride,p.y+38,9,10);
if(mode!=='running'){ctx.fillStyle='#111626b8';ctx.fillRect(0,0,900,400);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 38px system-ui';ctx.fillText(mode==='ready'?'준비됐나요?':mode==='paused'?'잠깐 쉬어가요':'한 번 더 달려볼까요?',450,170);ctx.font='20px system-ui';ctx.fillText(mode==='ready'?'시작 버튼을 누르세요':mode==='paused'?'계속 달리기를 눌러주세요':Math.floor(distance)+' m · 다시 달리기를 누르세요',450,215);}}
function frame(now){const dt=Math.min((now-last)/1000,.025);last=now;if(mode==='running')update(dt);draw();requestAnimationFrame(frame);}
startBtn.onclick=start;document.querySelector('#jump').onclick=jump;pauseBtn.onclick=pause;c.onpointerdown=e=>{e.preventDefault();jump();};document.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();if(!e.repeat)jump();}if(e.code==='Escape')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')pause();});reset();requestAnimationFrame(frame);
</script></body></html>
