<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>다다 게임방</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111326;color:#f7f7ff;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:40px 20px}h1{font-size:clamp(32px,6vw,56px);margin-bottom:10px}p{color:#bec3df;line-height:1.7}nav{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 20px;background:#303653;color:white}button:hover{background:#485274}button:focus-visible,input:focus-visible{outline:3px solid #b6ff75;outline-offset:3px}nav button.active{background:#b6ff75;color:#172115}.panel{background:#1c2038;padding:28px;border-radius:24px;min-height:330px}input{font:inherit;padding:14px;border-radius:12px;border:1px solid #6a7194;max-width:100%;width:150px}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin-top:20px}#cards button{font-size:28px;aspect-ratio:1;padding:5px}#cards button.matched{background:#436337}#status{min-height:30px;color:#b6ff75;font-weight:bold}footer{margin-top:28px;color:#929bbd}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
</style>
<main><span style="color:#b6ff75">DADA'S ARCADE</span><h1>오늘도, 한 판만 🎮</h1><p>설치 없이 즐기는 작은 게임방. 마음에 드는 게임을 골라보세요.</p>
<nav aria-label="게임 선택"><button data-game="guess" class="active">🔢 숫자 맞히기</button><button data-game="rps">✊ 가위바위보</button><button data-game="memory">🃏 기억력 카드</button></nav>
<section class="panel"><div id="game"></div><p id="status" role="status" aria-live="polite"></p></section><footer>다다 게임방 · PC와 모바일에서 즐겨보세요.</footer></main>
<script>
const game=document.querySelector('#game'),status=document.querySelector('#status');let generation=0;
function load(type){generation++;status.textContent='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.game===type));
if(type==='guess'){let target=1+Math.floor(Math.random()*100),tries=0,done=false;game.innerHTML='<h2>숫자 맞히기</h2><p>1부터 100 사이의 비밀 숫자를 찾아보세요.</p><form id="guess"><label for="number">예상 숫자</label><div class="actions"><input id="number" type="number" min="1" max="100" required><button>확인하기</button></div></form><button id="reset">새 게임</button>';document.querySelector('#guess').onsubmit=e=>{e.preventDefault();if(done)return;const n=Number(document.querySelector('#number').value);if(!Number.isInteger(n)||n<1||n>100)return;tries++;done=n===target;status.textContent=done?'정답! '+tries+'번 만에 맞혔어요 🎉':n<target?'더 큰 숫자예요 ↑':'더 작은 숫자예요 ↓';};document.querySelector('#reset').onclick=()=>load(type);}
if(type==='rps'){let wins=0,rounds=0;game.innerHTML='<h2>가위바위보</h2><p>컴퓨터와 대결해보세요. 무엇을 낼까요?</p><div class="actions"><button data-move="0">✊ 바위</button><button data-move="1">✋ 보</button><button data-move="2">✌️ 가위</button></div><p id="score">0승 / 0판</p>';game.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const player=Number(b.dataset.move),computer=Math.floor(Math.random()*3),result=(player-computer+3)%3;rounds++;if(result===1)wins++;status.textContent='컴퓨터: '+['바위','보','가위'][computer]+' · '+(result===0?'무승부!':result===1?'이겼어요 🎉':'컴퓨터가 이겼어요!');document.querySelector('#score').textContent=wins+'승 / '+rounds+'판';});}
if(type==='memory'){const token=generation;let items=['🍒','🍋','🍇','🥝','🍒','🍋','🍇','🥝'];for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}let first=null,locked=false,pairs=0,tries=0;game.innerHTML='<h2>기억력 카드</h2><p>카드를 뒤집어 같은 과일 4쌍을 찾아보세요.</p><button id="reset">다시 섞기</button><div id="cards"></div>';items.forEach((item,i)=>{const b=document.createElement('button');b.textContent='?';b.setAttribute('aria-label',(i+1)+'번 카드 뒤집기');b.onclick=()=>{if(locked||b.disabled||first===b)return;b.textContent=item;b.setAttribute('aria-label',item);if(!first){first=b;return;}tries++;const previous=first;first=null;if(previous.textContent===item){b.disabled=previous.disabled=true;b.classList.add('matched');previous.classList.add('matched');pairs++;status.textContent=pairs===4?'모두 찾았어요! '+tries+'번 만에 성공 🎉':pairs+' / 4쌍 · '+tries+'번 시도';}else{locked=true;setTimeout(()=>{if(token!==generation)return;[b,previous].forEach(x=>{x.textContent='?';x.setAttribute('aria-label','카드 뒤집기');});locked=false;},800);}};document.querySelector('#cards').append(b);});document.querySelector('#reset').onclick=()=>load(type);}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>load(b.dataset.game));load('guess');
</script></html>
