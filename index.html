<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다다런 · 함께해요! 당신의 기록은?</title><style>
*{box-sizing:border-box}body{margin:0;background:#111626;color:#f7f8ff;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:36px 18px}.tag{color:#bdff81;font-weight:800;letter-spacing:3px}h1{font-size:clamp(36px,7vw,64px);margin:12px 0}p{color:#bac5df;line-height:1.7}.hud{display:flex;gap:16px;justify-content:space-between;background:#202940;padding:18px;border-radius:18px;margin:24px 0}.hud strong{display:block;font-size:26px;color:white}canvas{display:block;width:100%;border-radius:22px;background:#c9eaf4;touch-action:manipulation}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{font:inherit;font-weight:700;background:#bdff81;color:#152313;border:0;border-radius:14px;padding:16px 26px;cursor:pointer;touch-action:manipulation}button.secondary{background:#283650;color:white}button:focus-visible,canvas:focus-visible{outline:3px solid #ffba69;outline-offset:4px}#status{min-height:28px}footer{color:#8292b2;font-size:13px;margin-top:30px}input,select{font:inherit;padding:13px;border-radius:12px;background:#1f2940;color:white;border:1px solid #617194;max-width:100%}.setup{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}.setup label{display:flex;flex-direction:column;gap:8px}input:focus-visible,select:focus-visible{outline:3px solid #bdff81}h1{font-size:clamp(30px,5vw,50px)}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:14px 8px;border-bottom:1px solid #33405b}th{color:#bdff81}.ranking{background:#202940;border-radius:18px;padding:22px;margin-top:32px}.ranking h2{margin-top:0}.note{font-size:13px;color:#9baccb}#save-status{color:#bdff81}button:disabled{opacity:.55;cursor:default}#duck{touch-action:none;user-select:none}#duck[aria-pressed="true"]{background:#775ed0}</style></head>
<body><main><div class="tag">DADA RUN</div><h1>다다런, 함께해요! 당신의 기록은?</h1><p>짱구와 흰둥이와 함께! 점프하고, 앉아서 피하고, 모두의 기록에 도전하세요.</p><div class="setup"><label>기록에 남길 이름<input id="name" maxlength="16" placeholder="이름 또는 닉네임" autocomplete="nickname"></label><label>함께 달릴 캐릭터<select id="character"><option value="shinchan">짱구</option><option value="shiro">흰둥이</option></select></label></div><div class="hud"><div>달린 거리<strong id="score">0 m</strong></div><div>최고 기록<strong id="best">0 m</strong></div><div>속도<strong id="speed">1.0 ×</strong></div></div><canvas id="game" width="900" height="400" tabindex="0" role="img" aria-label="장애물 달리기 게임. 스페이스 또는 위쪽 방향키로 점프하세요."></canvas><div class="controls"><button id="start">달리기 시작</button><button id="jump">↑ 점프 / 2단 점프</button><button id="duck" class="secondary">↓ 앉기 (누르고 있기)</button><button id="pause" class="secondary">일시정지</button></div><p id="status" role="status" aria-live="polite">↑ / 스페이스: 점프 · 공중에서 한 번 더: 2단 점프 · ↓ 누르고 있기: 앉기</p><p id="save-status" role="status" aria-live="polite"></p><button id="retry" class="secondary" hidden>기록 저장 다시 시도</button><section class="ranking"><h2>🏆 함께 달린 기록</h2><p class="note">입력한 이름과 기록은 모두에게 공개됩니다. 동일한 이름도 각각 기록되며, 상위 100개 기록을 보여드립니다.</p><button id="refresh" class="secondary">순위 새로고침</button><p id="ranking-status" role="status"></p><table><thead><tr><th>순위</th><th>이름</th><th>캐릭터</th><th>거리</th></tr></thead><tbody id="ranks"></tbody></table></section><footer>최고 기록은 이 브라우저에 저장됩니다. 공용 기록은 게임 종료 시 자동으로 등록됩니다.</footer></main>
<script>
const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),speedEl=document.querySelector('#speed'),status=document.querySelector('#status'),startBtn=document.querySelector('#start'),pauseBtn=document.querySelector('#pause');
let best=0;try{best=Number(localStorage.getItem('dada-run-best'))||0;}catch(e){}bestEl.textContent=best+' m';
const nameInput=document.querySelector('#name'),characterInput=document.querySelector('#character'),saveStatus=document.querySelector('#save-status'),retryBtn=document.querySelector('#retry');let runName='',runCharacter='shinchan',pendingRecords=[],saving=false;
try{nameInput.value=localStorage.getItem('dada-run-name')||'';pendingRecords=JSON.parse(localStorage.getItem('dada-run-pending')||'[]');if(!Array.isArray(pendingRecords))pendingRecords=[];}catch(e){pendingRecords=[];}
const API='https://dada-run-scores.perkymyna5.chatgpt.site/api/scores';
function persistPending(){try{localStorage.setItem('dada-run-pending',JSON.stringify(pendingRecords));}catch(e){}}
async function ranking(){const hint=document.querySelector('#ranking-status');hint.textContent='기록을 불러오는 중…';try{const res=await fetch(API);if(!res.ok)throw Error();const data=await res.json(),body=document.querySelector('#ranks');body.replaceChildren();data.scores.forEach((s,i)=>{const tr=document.createElement('tr');[i+1,s.name,s.character==='shiro'?'흰둥이':'짱구',s.distance+' m'].forEach(value=>{const td=document.createElement('td');td.textContent=String(value);tr.append(td);});body.append(tr);});hint.textContent=data.scores.length?'':'첫 번째 기록의 주인공이 되어보세요!';}catch(e){hint.textContent='순위를 불러오지 못했어요. 새로고침으로 다시 시도해주세요.';}}
async function saveRecords(){if(saving)return;saving=true;retryBtn.hidden=true;saveStatus.textContent='기록을 저장하는 중…';try{while(pendingRecords.length){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pendingRecords[0])});if(!res.ok)throw Error();pendingRecords.shift();persistPending();}saveStatus.textContent='공용 순위표에 기록을 남겼어요!';await ranking();}catch(e){saveStatus.textContent='저장하지 못했어요. 기록은 보관되어 있으니 다시 시도해주세요.';retryBtn.hidden=false;}finally{saving=false;}}
retryBtn.onclick=saveRecords;document.querySelector('#refresh').onclick=ranking;
const floor=320;let mode='ready',player,obstacles,distance,speed,spawn,time,last=0,jumps=0,duckHeld=false;
function reset(){jumps=0;duckHeld=false;player={x:110,y:floor-48,w:32,h:48,vy:0};obstacles=[];distance=0;speed=300;spawn=1.4;time=0;scoreEl.textContent='0 m';speedEl.textContent='1.0 ×';}
function start(){const name=nameInput.value.trim();if(!name){status.textContent='기록에 남길 이름을 먼저 입력해주세요.';nameInput.focus();return;}runName=name;runCharacter=characterInput.value;try{localStorage.setItem('dada-run-name',name);}catch(e){}nameInput.disabled=characterInput.disabled=true;reset();mode='running';startBtn.textContent='처음부터 다시';pauseBtn.textContent='일시정지';status.textContent='낮은 장애물은 점프! 높은 장애물은 2단 점프! 날아오는 새는 ↓ 앉기로 피하세요!';}
function setDuck(value){duckHeld=value;document.querySelector('#duck').setAttribute('aria-pressed',String(value));if(mode==='running'&&player.vy===0&&player.y>=floor-player.h-.1){player.h=value?25:48;player.y=floor-player.h;}}
function jump(){if(mode==='ready')start();if(mode==='running'&&jumps<2){if(player.h!==48){player.h=48;player.y=floor-48;}duckHeld=false;document.querySelector('#duck').setAttribute('aria-pressed','false');player.vy=jumps===0?-640:-580;jumps++;}}
function pause(){setDuck(false);if(mode==='running'){mode='paused';pauseBtn.textContent='계속 달리기';status.textContent='잠시 쉬는 중이에요.';}else if(mode==='paused'){mode='running';pauseBtn.textContent='일시정지';status.textContent='다시 달려요!';}}
function end(){mode='over';nameInput.disabled=characterInput.disabled=false;pendingRecords.push({id:crypto.randomUUID(),name:runName,character:runCharacter,distance:Math.floor(distance)});persistPending();saveRecords();const record=Math.floor(distance);if(record>best){best=record;bestEl.textContent=best+' m';try{localStorage.setItem('dada-run-best',String(best));}catch(e){}}status.textContent=record+' m 달렸어요! 다시 도전해보세요.';startBtn.textContent='다시 달리기';}
function update(dt){time+=dt;speed=Math.min(540,300+time*3);distance+=speed*dt/20;player.vy+=1700*dt;player.y+=player.vy*dt;if(player.y>=floor-player.h){player.y=floor-player.h;player.vy=0;jumps=0;player.h=duckHeld?25:48;player.y=floor-player.h;}spawn-=dt;if(spawn<=0){const aerial=time>8&&Math.random()<.35;const tall=!aerial&&time>12&&Math.random()<.3;obstacles.push({x:920,w:aerial?44:tall?45:26+Math.random()*12,h:aerial?22:tall?145:32+Math.random()*18,y:aerial?floor-60:tall?floor-145:null,aerial});spawn=(tall?1.8:1.4)+Math.random()*.7;}for(const o of obstacles){o.x-=speed*dt;if(player.x+player.w-5>o.x+3&&player.x+5<o.x+o.w-3&&player.y+player.h-3>(o.y??floor-o.h)+3&&player.y+3<(o.y??floor-o.h)+o.h-3){end();break;}}obstacles=obstacles.filter(o=>o.x+o.w>0);scoreEl.textContent=Math.floor(distance)+' m';speedEl.textContent=(speed/300).toFixed(1)+' ×';}
function drawCharacter(p,character){const stride=mode==='running'&&p.vy===0?Math.sin(time*22)*4:0;ctx.save();ctx.translate(p.x-3,p.y);ctx.scale(.72,p.h/65);if(character==='shiro'){ctx.strokeStyle='#8b94a4';ctx.lineWidth=2;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(21,35,20,14,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(28,18,19,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(9,20,6,13,-.3,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(45,20,5,12,.4,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillRect(9+stride,42,6,14);ctx.fillRect(29-stride,42,6,14);ctx.fillStyle='#253046';ctx.fillRect(22,16,3,4);ctx.fillRect(35,16,3,4);ctx.fillRect(27,22,6,4);ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(2,30,7,Math.PI/2,Math.PI*1.6);ctx.stroke();}else{ctx.fillStyle='#171a22';ctx.beginPath();ctx.ellipse(26,16,23,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffcf9c';ctx.beginPath();ctx.ellipse(25,22,23,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171a22';ctx.fillRect(10,13,11,4);ctx.fillRect(29,13,11,4);ctx.fillRect(17,20,3,4);ctx.fillRect(33,20,3,4);ctx.fillStyle='#ee5b54';ctx.fillRect(10,34,28,14);ctx.fillStyle='#ffe17c';ctx.fillRect(11,48,27,8);ctx.fillStyle='#ffcf9c';ctx.fillRect(12+stride,56,8,7);ctx.fillRect(28-stride,56,8,7);ctx.fillStyle='#f5ebc9';ctx.fillRect(10+stride,61,11,4);ctx.fillRect(27-stride,61,11,4);}ctx.restore();}
function draw(){const sky=ctx.createLinearGradient(0,0,0,400);sky.addColorStop(0,'#c2e7f8');sky.addColorStop(1,'#eef5d9');ctx.fillStyle=sky;ctx.fillRect(0,0,900,400);ctx.fillStyle='#fff9d1';ctx.beginPath();ctx.arc(760,65,32,0,Math.PI*2);ctx.fill();for(let i=0;i<6;i++){const x=((i*210-distance*3)%1200+1200)%1200-150;ctx.fillStyle='#ffffffa0';ctx.beginPath();ctx.ellipse(x,75+i%2*40,55,17,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#9bc4a1';for(let i=0;i<7;i++){const x=i*180-100-(distance*2%180);ctx.beginPath();ctx.moveTo(x,320);ctx.lineTo(x+100,165+i%2*40);ctx.lineTo(x+210,320);ctx.fill();}ctx.fillStyle='#456a4a';ctx.fillRect(0,floor,900,6);ctx.fillStyle='#e4d6b8';ctx.fillRect(0,floor+6,900,74);ctx.fillStyle='#bfad8b';for(let i=0;i<24;i++)ctx.fillRect(i*45-(distance*20%45),350,15,3);
for(const o of obstacles){const oy=o.y??floor-o.h;if(o.aerial){ctx.fillStyle='#755fc9';ctx.beginPath();ctx.ellipse(o.x+22,oy+11,22,7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#755fc9';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(o.x+5,oy+10);ctx.lineTo(o.x+22,oy+3+Math.sin(time*16)*5);ctx.lineTo(o.x+38,oy+10);ctx.stroke();}else{ctx.fillStyle=o.h>100?'#668c56':'#dd7654';ctx.fillRect(o.x,oy,o.w,o.h);ctx.fillStyle=o.h>100?'#a6d78a':'#ffc599';ctx.fillRect(o.x+4,oy+4,o.w-8,6);}}
drawCharacter(player,mode==='ready'||mode==='over'?characterInput.value:runCharacter);
if(mode!=='running'){ctx.fillStyle='#111626b8';ctx.fillRect(0,0,900,400);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 38px system-ui';ctx.fillText(mode==='ready'?'준비됐나요?':mode==='paused'?'잠깐 쉬어가요':'한 번 더 달려볼까요?',450,170);ctx.font='20px system-ui';ctx.fillText(mode==='ready'?'시작 버튼을 누르세요':mode==='paused'?'계속 달리기를 눌러주세요':Math.floor(distance)+' m · 다시 달리기를 누르세요',450,215);}}
function frame(now){const dt=Math.min((now-last)/1000,.025);last=now;if(mode==='running')update(dt);draw();requestAnimationFrame(frame);}
startBtn.onclick=start;document.querySelector('#jump').onclick=jump;pauseBtn.onclick=pause;c.onpointerdown=e=>{e.preventDefault();jump();};document.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)&&!['BUTTON','INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(!e.repeat)jump();}if(e.code==='ArrowDown'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();setDuck(true);}if(e.code==='Escape')pause();});document.addEventListener('keyup',e=>{if(e.code==='ArrowDown')setDuck(false);});window.addEventListener('blur',()=>{setDuck(false);if(mode==='running')pause();});const duckBtn=document.querySelector('#duck');duckBtn.onpointerdown=e=>{e.preventDefault();duckBtn.setPointerCapture(e.pointerId);setDuck(true);};duckBtn.onpointerup=duckBtn.onpointercancel=()=>setDuck(false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')pause();});reset();ranking();if(pendingRecords.length)saveRecords();requestAnimationFrame(frame);
</script></body></html>
